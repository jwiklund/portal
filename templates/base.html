<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Portal" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <title>{% block title %}{% endblock %}</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface-2: #161616;
      --border: #2e2e2e;
      --border-strong: #3a3a3a;
      --text: #e8e8e8;
      --text-dim: #aaa;
      --text-muted: #888;
      --accent: #d4b483;
      --accent-hover: #c4a473;
      --green: #2e7d32;
      --green-bright: #51e78f;
      --red: #b45d5d;
      --red-bright: #e76f51;
      --radius: 8px;
      --radius-sm: 6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Georgia', serif;
      color: var(--text);
    }

    header nav {
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .nav-main { display: flex; align-items: center; gap: 1.5rem; }
    .nav-main a, .nav-links a { color: #999; text-decoration: none; font-size: 0.9rem; transition: color 0.15s; }
    .nav-main a:hover, .nav-links a:hover { color: var(--text); }
    .nav-main a.active, .nav-links a.active { color: var(--text); font-weight: bold; }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; margin-left: 1.5rem; }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      padding: 0.25rem;
    }

    @media (max-width: 640px) {
      header nav {
        position: relative;
        flex-wrap: wrap;
        padding-right: 3.5rem;
      }
      .nav-toggle {
        display: block;
        position: absolute;
        top: 0.75rem;
        right: 1.25rem;
      }
      .nav-links {
        display: none;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        gap: 0.75rem;
        padding: 1rem 0 0.5rem;
      }
      .nav-links.open {
        display: flex;
      }
    }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #444;
    }

    main { max-width: 800px; margin: 0 auto; padding: 3rem 2rem; }

    /* ---- Shared components ---- */

    /* Page header: title + inline actions */
    .page-head {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .page-head h1, .page-head h2 {
      font-size: 2rem;
      font-weight: normal;
      margin: 0;
    }

    /* Generic heading sizes (templates can still override) */
    h2 { font-size: 2rem; font-weight: normal; margin-bottom: 1rem; }
    h3 { font-size: 1.15rem; font-weight: normal; color: #ccc; }

    /* Lists of cards: <ul class="list"> <li><a class="card"> */
    .list { list-style: none; display: flex; flex-direction: column; gap: 1rem; }
    .card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: var(--text);
    }
    a.card:hover { border-color: #444; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .card-head { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    .card-title { font-size: 1.15rem; font-weight: 500; }
    .card-date { font-size: 0.85rem; color: var(--text-dim); }
    .card-meta { font-size: 0.85rem; color: var(--text-muted); }
    .card-price { color: var(--accent); }
    .card-body { font-size: 0.9rem; color: #ccc; margin-top: 0.5rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .card-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }

    /* Chips / tags */
    .chips { list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
    .chip {
      font-size: 0.78rem;
      color: #bbb;
      background: #242424;
      border: 1px solid #333;
      border-radius: 999px;
      padding: 0.15rem 0.6rem;
      text-decoration: none;
    }
    a.chip:hover { border-color: var(--accent); color: var(--text); }

    /* Buttons */
    .btn {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      line-height: 1.4;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-secondary:hover { background: var(--accent); color: #1a1a1a; opacity: 1; }
    .btn-muted { background: #2a2a2a; color: var(--text); border: 1px solid var(--border-strong); }
    .btn-muted:hover { opacity: 1; border-color: #555; }
    .btn-danger { background: var(--red); color: #1a1a1a; }
    .btn-danger:hover { opacity: 1; background: #c26a6a; }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }

    /* Toolbars / action rows */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .actions { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }

    /* Status badges */
    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      white-space: nowrap;
      font-weight: 500;
    }
    .badge-ready { background: #1a3a1a; color: #6fcf6f; border: 1px solid #2a5a2a; }
    .badge-warn { background: #3a2a0a; color: #e8c84a; border: 1px solid #5a4a1a; }
    .badge-error { background: #3a1a1a; color: #e57373; border: 1px solid #5a2a2a; }
    .badge-muted { background: #1a1a1a; color: #666; border: 1px solid #333; }
    .badge-new { background: var(--accent); color: #1a1a1a; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.68rem; border-radius: 999px; padding: 0.1rem 0.55rem; }

    /* Forms */
    .form { max-width: 600px; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.5rem; color: #ccc; font-size: 0.9rem; }
    input, textarea {
      width: 100%;
      padding: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }
    textarea { resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: #555; }
    .form-actions { display: flex; gap: 1rem; margin-top: 2rem; align-items: center; flex-wrap: wrap; }
    .hint { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.4rem; }
    .empty { color: var(--text-dim); }

    /* Messages */
    .msg { padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; }
    .msg-error { color: #e0b0b0; background: #2a1a1a; border: 1px solid var(--red); }
    .msg-success { color: #a7d7a7; background: #16261a; border: 1px solid #2a5a2a; }
    .msg-info { color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); }

    /* Back link */
    .back-link { display: inline-block; margin-bottom: 1.5rem; color: #999; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { color: var(--text); }

    /* Definition-list metadata (detail pages) */
    .meta { display: grid; grid-template-columns: 8rem 1fr; gap: 0.35rem 1rem; margin: 1.5rem 0; font-size: 0.9rem; }
    .meta dt { color: var(--text-muted); }
    .meta dd { color: var(--text); word-break: break-word; }

    /* Lightbox / dialog-ish overlays */
    pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #ccc;
      white-space: pre-wrap;
      word-break: break-word;
    }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="nav-main">
        {% if is_admin %}
          <a href="/upcoming" class="{{ 'active' if current_path.startswith('/upcoming') else '' }}">Upcoming</a>
          <a href="/past" class="{{ 'active' if current_path.startswith('/past') else '' }}">Past</a>
          <a href="/playlists" class="{{ 'active' if current_path.startswith('/playlists') else '' }}">Playlists</a>
        {% else %}
          <a href="/upcoming/view" class="{{ 'active' if current_path.startswith('/upcoming') else '' }}">Upcoming</a>
          <a href="/past/view" class="{{ 'active' if current_path.startswith('/past') else '' }}">Past</a>
        {% endif %}
      </div>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false" onclick="toggleMenu()">&#9776;</button>
      <div class="nav-links" id="nav-links">
        {% if is_admin %}
          <a href="/podcasts" class="{{ 'active' if current_path.startswith('/podcasts') else '' }}">Podcasts</a>
          <a href="/shows" class="{{ 'active' if current_path.startswith('/shows') else '' }}">Shows</a>
          <a href="/notifications" class="{{ 'active' if current_path.startswith('/notifications') else '' }}">Notifications</a>
          <a href="/errors" class="{{ 'active' if current_path.startswith('/errors') else '' }}">Errors</a>
        {% endif %}
        {% if user and user.picture %}
          <img src="{{ user.picture }}" class="avatar" alt="{{ user.name }}" />
        {% endif %}
        <a href="/logout">Sign out</a>
      </div>
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>

{% block extra_scripts %}{% endblock %}

<script>
  function toggleMenu() {
    var links = document.getElementById('nav-links');
    var btn = document.querySelector('.nav-toggle');
    var open = links.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
</script>
</body>
</html>
