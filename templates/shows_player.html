<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0f0f;
      font-family: 'Georgia', serif;
      color: #e8e8e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h2 {
      font-size: 1.6rem;
      font-weight: normal;
      margin-bottom: 1.5rem;
      color: #ccc;
      text-align: center;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cast-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #d4b483;
      background: transparent;
      color: #d4b483;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.15s;
    }
    .cast-btn:hover { background: rgba(212, 180, 131, 0.15); }
    .cast-btn.connected { background: #d4b483; color: #1a1a1a; }

    .cast-status {
      font-size: 0.85rem;
      color: #888;
    }
    .cast-status.connected { color: #6fcf6f; }

    video {
      max-width: 100%;
      width: 800px;
      border-radius: 8px;
      background: #000;
      border: 1px solid #2e2e2e;
    }

    .fallback-label {
      font-size: 0.8rem;
      color: #666;
      margin-top: 1.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>{{ title }}</h2>

  <div class="controls">
    <button id="castBtn" class="cast-btn" title="Cast">▷</button>
    <span id="castStatus" class="cast-status">Chromecast not connected</span>
  </div>

  <video id="videoPlayer" controls>
    <source src="{{ video_url }}" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <p class="fallback-label">Open this page on a device with Chromecast support to cast.</p>

  <script>
window['__onGCastApiAvailable'] = function(isAvailable, reason) {
  var statusEl = document.getElementById('castStatus');
  if (isAvailable) {
    initCast();
  } else {
    statusEl.textContent = 'Chromecast unavailable' + (reason ? ' (' + reason + ')' : '');
    console.error('Cast API unavailable. Are you on HTTPS?', reason);
  }
};

function initCast() {
  var options = new cast.framework.CastOptions();
  options.receiverApplicationId = chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID;
  options.autoJoinPolicy = chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED;
  var castContext = cast.framework.CastContext.getInstance();
  castContext.setOptions(options);

  var statusEl = document.getElementById('castStatus');
  var btnEl = document.getElementById('castBtn');

  function updateFromState(state) {
    switch (state) {
      case cast.framework.CastState.NO_DEVICES_AVAILABLE:
        statusEl.textContent = 'No Chromecast devices found';
        statusEl.classList.remove('connected');
        btnEl.classList.remove('connected');
        break;
      case cast.framework.CastState.NOT_CONNECTED:
        statusEl.textContent = 'Chromecast available';
        statusEl.classList.remove('connected');
        btnEl.classList.remove('connected');
        break;
      case cast.framework.CastState.CONNECTING:
        statusEl.textContent = 'Connecting…';
        break;
      case cast.framework.CastState.CONNECTED:
        statusEl.textContent = 'Casting';
        statusEl.classList.add('connected');
        btnEl.classList.add('connected');
        break;
    }
  }

  updateFromState(castContext.getCastState());
  castContext.addEventListener(
    cast.framework.CastContextEventType.CAST_STATE_CHANGED,
    function(e) { updateFromState(e.castState); }
  );
}

document.getElementById('castBtn').addEventListener('click', function() {
  var castContext = cast.framework.CastContext.getInstance();
  var statusEl = document.getElementById('castStatus');

  castContext.requestSession().then(function() {
    var session = castContext.getCurrentSession();
    var mediaInfo = new chrome.cast.media.MediaInfo('{{ video_url }}', 'video/mp4');
    mediaInfo.streamType = chrome.cast.media.StreamType.BUFFERED;

    var metadata = new chrome.cast.media.GenericMediaMetadata();
    metadata.title = '{{ title }}';
    mediaInfo.metadata = metadata;

    var request = new chrome.cast.media.LoadRequest(mediaInfo);
    session.loadMedia(request).then(function() {
      document.getElementById('videoPlayer').pause();
    }).catch(function(err) {
      statusEl.textContent = 'Failed to load media: ' + (err.description || err.code || err);
      console.error('loadMedia error', err);
    });
  }).catch(function(err) {
    statusEl.textContent = 'Failed to connect: ' + (err.description || err.code || err);
    console.error('requestSession error', err);
  });
});
  </script>
</body>
</html>
