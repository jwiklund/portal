[project]
name = "born-portal"
version = "0.1.0"
description = "Born portal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "blacksheep~=2.6",
    "httpx~=0.28",
    "jinja2~=3.1",
    "litellm>=1.83.4",
    "markdownify>=1.2.2",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build<=0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
]

[project.scripts]
app = "born_portal.main:main"
event = "born_portal.event:main"
