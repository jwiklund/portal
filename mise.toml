[shell_alias]
run = "uv run uvicorn born_portal.main:app --reload --port 8080 --log-level debug"
fetch = "uv run python -m born_portal.main fetch"
potential = "uv run python -m born_portal.main potential"
potential-duplicates = "uv run python -m born_portal.main potential --duplicates"
backup = "uv run python -m born_portal.main backup backup.sql"
restore = "uv run python -m born_portal.main restore backup.sql"
check = "uv run pytest"
pyright = "uv run pyright"
sync = "uv sync"
format = "black src; ruff check --fix src"
